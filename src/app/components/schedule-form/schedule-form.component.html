<div class="schedule-container">
  <form [formGroup]="scheduleForm" (ngSubmit)="agendarCita()">
    <ion-card class="form-card">
      <ion-card-header>
        <h2 class="form-title">Agendar Cita</h2>
      </ion-card-header>

      <ion-card-content class="form-content">
        <label class="form-label" for="medico">Selecciona un medico</label>
        <ion-select
          formControlName="medico"
          interface="popover"
          placeholder="Selecciona un médico"
          (ionChange)="onMedicoFechaChange()"
          class="form-input"
        >
          <ion-select-option *ngFor="let medico of medicos" [value]="medico.id">
            {{ medico.nombre }} ({{ medico.especialidad }})
          </ion-select-option>
        </ion-select>

        <ion-text color="danger" *ngIf="isInvalid('medico')">
          <p class="error-message">Este campo es obligatorio.</p>
        </ion-text>

        <label class="form-label" for="fecha">Selecciona una fecha</label>
        <ion-datetime
          formControlName="fecha"
          presentation="date"
          (ionChange)="onMedicoFechaChange()"
          class="form-input"
        ></ion-datetime>

        <ion-text color="danger" *ngIf="isInvalid('fecha')">
          <p class="error-message">Este campo es obligatorio.</p>
        </ion-text>

        <label class="form-label" for="hora">Selecciona una hora</label>
        <ion-select
          formControlName="hora"
          interface="popover"
          placeholder="Selecciona una hora"
          class="form-input"
        >
          <ion-select-option *ngFor="let hora of horasDisponibles" [value]="hora">
            {{ hora }}
          </ion-select-option>
        </ion-select>
        
        <ion-text color="danger" *ngIf="isInvalid('hora')">
          <p class="error-message">Este campo es obligatorio.</p>
        </ion-text>

        <ion-item class="form-input">
          <ion-label position="floating">Ubicacion</ion-label>
          <ion-input formControlName="ubicacion" readonly></ion-input>
        </ion-item>

        <button type="submit" class="form-button" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Agendando...' : 'Agendar' }}
        </button>

        <p class="form-message" *ngIf="citaAgendada">
          Cita agendada exitosamente
        </p>
      </ion-card-content>
    </ion-card>
  </form>
</div>
