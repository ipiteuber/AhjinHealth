<app-navbar></app-navbar>

<div class="medicos-container">
  <ion-list>
    <ion-item *ngFor="let medico of medicos">
      <ion-label>
        <h2>{{ medico.nombre }}</h2>
        <p>Especialidad: {{ medico.especialidad }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <div *ngIf="medicos.length === 0" class="no-medicos">
    <p>No hay medicos registrados.</p>
  </div>
</div>

<app-footer></app-footer>
